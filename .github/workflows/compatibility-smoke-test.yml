name: v6.20 compatibility smoke test

on:
  push:
    branches: [ main ]
    paths:
      - "launcher/**"
      - "src/**"
      - "distribution/**"
      - "tests/legacy/**"
      - ".github/workflows/compatibility-smoke-test.yml"
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell and check the Windows 7 runtime
        shell: powershell
        run: |
          $files = Get-ChildItem -Path src,distribution,tests/legacy -Filter '*.ps1'
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          foreach ($file in @('src/PCInfo_Legacy_Win7.ps1', 'src/PCInfo_Sales.ps1', 'tests/legacy/Legacy_VM_Preflight.ps1')) {
            $content = Get-Content -LiteralPath $file -Raw
            foreach ($token in @('Get-CimInstance','Get-PhysicalDisk','Get-StorageReliabilityCounter','Get-WinEvent','$PSScriptRoot','[PSCustomObject]','Invoke-RestMethod')) {
              if ($content.Contains($token)) { throw "Found $token in $file" }
            }
          }

      - name: Build, extract and exercise launcher routes
        shell: powershell
        run: |
          $archive = & .\distribution\Build_EmployeePackage.ps1 -OutputDirectory "$env:RUNNER_TEMP\pcinfo-build"
          $extract = Join-Path $env:RUNNER_TEMP 'pcinfo-extract'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $package = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          $launcher = (Get-ChildItem -LiteralPath $package.FullName -Filter '*.cmd').FullName
          $env:REPAIR_PCINFO_TEST_MODE = '1'
          $output = & $launcher
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'TEST_SELECTED_MODE=MODERN') { throw ($output | Out-String) }
          $modes = 'XP','LEGACY','MODERN'
          foreach ($selection in 1..3) {
            $output = "$selection" | & $launcher /manual
            if ($LASTEXITCODE -ne 0 -or ($output | Out-String) -notmatch "TEST_SELECTED_MODE=$($modes[$selection - 1])") { throw ($output | Out-String) }
          }
